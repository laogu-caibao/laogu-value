<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">估值锚 — laogu-value</title>
  <desc id="desc">laogu-value — 估值锚：输入一家公司，输出一张“贵/便宜定位卡”，看清估值落在过去 5 年的什么位置。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#131110"/>
  <line x1="688" y1="48" x2="688" y2="372" stroke="#2A251F" stroke-width="1.5"/>

  <!-- 左：标题区 -->
  <g id="title-block">
    <text class="mono" x="56" y="80" font-size="17" letter-spacing="2" fill="#A855F7">LAOGU-CAIBAO · AI SKILL</text>
    <text class="sans" x="56" y="132" font-size="40" font-weight="700" fill="#F5F0E8">laogu-value</text>
    <text class="sans" x="56" y="172" font-size="23" font-weight="600" fill="#F5F0E8">估值锚</text>
    <text class="sans" x="56" y="206" font-size="20" fill="#C9C2B8">输入一家公司，输出一张“贵/便宜定位卡”，看清估值落在过</text>
    <text class="sans" x="56" y="232" font-size="20" fill="#C9C2B8">去 5 年的什么位置。</text>

    <rect x="56" y="258" width="600" height="52" rx="10" fill="#1B1713" stroke="#A855F7" stroke-width="1.5"/>
    <text class="mono" x="76" y="291" font-size="18" fill="#A855F7">npx skills add laogu-caibao/laogu-value</text>

    <text class="sans" x="56" y="352" font-size="17" fill="#9A938A">v1.0.4 · SKILL.md 73 行 · references/sources.md · MIT</text>
  </g>

